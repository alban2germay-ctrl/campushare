<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#F0EBE1]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CampuShare — Matos Étudiant ENSEEIHT (PWA)</title>
  
  <!-- PWA & Mobile Web Capabilities -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#52796F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CampuShare">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          },
          colors: {
            sand: {
              50: '#FDFBF7',
              100: '#FAF8F5',
              200: '#F4EFE6',
              300: '#EAE2D5',
              800: '#4A443A',
              900: '#2C2720',
            },
            sage: {
              50: '#F4F7F4',
              100: '#E6EFE6',
              500: '#52796F',
              600: '#43665D',
              700: '#354F48',
            },
            terracotta: {
              500: '#D87D4A',
              600: '#C06637',
            }
          }
        }
      }
    }
  </script>
  
  <style>
    /* Safe-areas support for notch & home bar */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    
    /* Smooth momentum scrolling on mobile */
    .mobile-scroll-container {
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .mobile-scroll-container::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="h-full w-full bg-[#EAE2D5] flex items-center justify-center font-sans antialiased selection:bg-[#E6EFE6] selection:text-[#354F48]">
  <div id="root" class="h-full w-full flex items-center justify-center"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [currentTab, setCurrentTab] = useState('explore');
      const [userMode, setUserMode] = useState('renter'); // 'renter' (Alban / Emprunteur) ou 'owner' (Mathys / Propriétaire)
      const [activeSubTask, setActiveSubTask] = useState('1.1.1');

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [currentTab, userMode, activeSubTask]);

      return (
        <div className="relative w-full h-full sm:h-[844px] sm:max-w-[390px] sm:rounded-[44px] sm:shadow-2xl sm:ring-8 sm:ring-black/10 bg-[#FAF8F5] overflow-hidden flex flex-col border border-[#EAE2D5]">
          
          {/* Status Bar Simulée (Masquée si installée en PWA native) */}
          <div className="pt-2 px-6 flex items-center justify-between text-xs font-semibold text-[#2C2720] flex-shrink-0 select-none">
            <span>09:41</span>
            {/* Dynamic Island / Encoche factice sur ordinateur */}
            <div className="hidden sm:block w-24 h-4 bg-[#2C2720] rounded-full mx-auto"></div>
            <div className="flex items-center gap-1.5 text-xs text-[#2C2720]">
              <i data-lucide="wifi" className="w-3.5 h-3.5"></i>
              <i data-lucide="battery" className="w-4 h-4"></i>
            </div>
          </div>

          {/* Header Mobile Campus */}
          <header className="px-5 pt-3 pb-3 border-b border-[#EAE2D5] bg-white/80 backdrop-blur-md flex items-center justify-between flex-shrink-0 z-20">
            <div className="flex items-center gap-2.5">
              <div className="w-9 h-9 rounded-2xl bg-[#E6EFE6] text-[#52796F] font-extrabold flex items-center justify-center text-sm shadow-xs">
                🎒
              </div>
              <div>
                <div className="flex items-center gap-1.5">
                  <h1 className="font-extrabold text-[#2C2720] text-sm tracking-tight">CampuShare</h1>
                  <span className="px-1.5 py-0.2 rounded-md bg-[#E6EFE6] text-[#354F48] text-[9px] font-bold">
                    PWA
                  </span>
                </div>
                <p className="text-[10px] text-[#6B6358] font-semibold">Toulouse INP • ENSEEIHT</p>
              </div>
            </div>

            {/* Sélecteur de Mode pour tester les deux chantiers (Alban vs Mathys) */}
            <div className="flex items-center bg-[#FAF8F5] p-1 rounded-xl border border-[#EAE2D5]">
              <button
                onClick={() => setUserMode('renter')}
                className={`px-2 py-1 rounded-lg text-[10px] font-bold transition ${
                  userMode === 'renter'
                    ? 'bg-[#52796F] text-white shadow-xs'
                    : 'text-[#6B6358] hover:text-[#2C2720]'
                }`}
                title="Chantier Emprunteur (Recherche & Réservation)"
              >
                Emprunteur
              </button>
              <button
                onClick={() => setUserMode('owner')}
                className={`px-2 py-1 rounded-lg text-[10px] font-bold transition ${
                  userMode === 'owner'
                    ? 'bg-[#D87D4A] text-white shadow-xs'
                    : 'text-[#6B6358] hover:text-[#2C2720]'
                }`}
                title="Chantier Propriétaire (Ajout & Matos)"
              >
                Propriétaire
              </button>
            </div>
          </header>

          {/* Corps de l'Application Scrollable */}
          <main className="flex-1 overflow-y-auto mobile-scroll-container p-5 space-y-4">
            
            {/* Statut de la Micro-tâche Active */}
            <div className="p-4 rounded-3xl bg-white border border-[#EAE2D5] shadow-xs space-y-2.5">
              <div className="flex items-center justify-between">
                <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-[#E6EFE6] text-[#354F48]">
                  <span className="w-1.5 h-1.5 rounded-full bg-[#52796F] animate-pulse"></span>
                  Micro-tâche 1.1.1 Validée
                </span>
                <span className="text-[10px] text-[#8C8275] font-mono font-semibold">@agent-architect</span>
              </div>
              <h2 className="text-base font-extrabold text-[#2C2720] leading-snug">
                Coquille Smartphone & Safe Areas Opérationnelles
              </h2>
              <p className="text-xs text-[#6B6358] leading-relaxed">
                Ce cadre représente exactement votre future PWA sur les smartphones des élèves de l'N7. Il s'adapte à toutes les tailles d'écran sans aucune déformation.
              </p>
            </div>

            {/* Présentation Pédagogique des 2 Chantiers */}
            <div className="space-y-3">
              <span className="text-[10px] font-bold text-[#8C8275] uppercase tracking-wider block">
                Mode Actif : {userMode === 'renter' ? 'Chantier A (Emprunteur)' : 'Chantier B (Propriétaire)'}
              </span>

              {userMode === 'renter' ? (
                /* Aperçu Chantier Emprunteur */
                <div className="p-4.5 rounded-3xl bg-gradient-to-br from-[#FAF8F5] to-[#F4EFE6] border border-[#EAE2D5] space-y-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🔍</span>
                    <div>
                      <h3 className="font-bold text-sm text-[#2C2720]">Parcours Découverte & Emprunt</h3>
                      <p className="text-[11px] text-[#6B6358]">Trouver et bloquer du matos pour le week-end</p>
                    </div>
                  </div>
                  <div className="p-3 rounded-2xl bg-white/90 border border-[#EAE2D5] text-xs space-y-1.5">
                    <div className="flex items-center justify-between">
                      <span className="text-[#8C8275]">Bannière week-end :</span>
                      <span className="font-bold text-[#52796F]">Ven 17h &rarr; Dim 20h</span>
                    </div>
                    <div className="flex items-center justify-between">
                      <span className="text-[#8C8275]">Catégories clés :</span>
                      <span className="font-bold text-[#2C2720]">🎉 Soirée &bull; 🏔️ Ski &bull; 🔨 Brico</span>
                    </div>
                  </div>
                </div>
              ) : (
                /* Aperçu Chantier Propriétaire */
                <div className="p-4.5 rounded-3xl bg-gradient-to-br from-[#FEF9EF] to-[#F8EFE3] border border-[#F4E3C5] space-y-3">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📸</span>
                    <div>
                      <h3 className="font-bold text-sm text-[#785E2F]">Parcours Propriétaire Express</h3>
                      <p className="text-[11px] text-[#8C734B]">Lister son objet en moins de 60s par photo</p>
                    </div>
                  </div>
                  <div className="p-3 rounded-2xl bg-white/90 border border-[#F4E3C5] text-xs space-y-1.5">
                    <div className="flex items-center justify-between">
                      <span className="text-[#8C734B]">Prise de vue :</span>
                      <span className="font-bold text-[#D87D4A]">Appareil photo smartphone</span>
                    </div>
                    <div className="flex items-center justify-between">
                      <span className="text-[#8C734B]">Caution recommandée :</span>
                      <span className="font-bold text-[#785E2F]">Pré-autorisation sans débit</span>
                    </div>
                  </div>
                </div>
              )}
            </div>

            {/* Checklist d'Avancement Scientifique */}
            <div className="p-4 rounded-3xl bg-white border border-[#EAE2D5] space-y-2">
              <span className="text-[11px] font-bold text-[#2C2720] flex items-center gap-1.5">
                <i data-lucide="list-checks" className="w-3.5 h-3.5 text-[#52796F]"></i>
                Prochaines Micro-tâches :
              </span>
              <div className="text-[11px] text-[#6B6358] space-y-1.5 pl-1">
                <div className="flex items-center gap-2 text-[#52796F] font-bold">
                  <span>&bull;</span>
                  <span>1.1.2 : Header Campus & Profil Promo (@agent-ui-design)</span>
                </div>
                <div className="flex items-center gap-2 text-[#8C8275]">
                  <span>&bull;</span>
                  <span>1.1.3 : Bottom Navigation Bar tactile au pouce (@agent-ui-design)</span>
                </div>
                <div className="flex items-center gap-2 text-[#8C8275]">
                  <span>&bull;</span>
                  <span>1.2.1 : Activation du Manifest PWA plein écran (@agent-architect)</span>
                </div>
              </div>
            </div>

          </main>

          {/* Bottom Navigation Bar Tactile (Squelette de la Micro-tâche 1.1.3) */}
          <nav className="border-t border-[#EAE2D5] bg-white/95 backdrop-blur-md px-4 py-2 flex items-center justify-around flex-shrink-0 z-20">
            <button
              onClick={() => setCurrentTab('explore')}
              className={`flex flex-col items-center gap-0.5 transition ${
                currentTab === 'explore' ? 'text-[#52796F]' : 'text-[#8C8275] hover:text-[#2C2720]'
              }`}
            >
              <i data-lucide="search" className="w-5 h-5"></i>
              <span className="text-[10px] font-bold">Explorer</span>
            </button>
            <button
              onClick={() => setCurrentTab('items')}
              className={`flex flex-col items-center gap-0.5 transition ${
                currentTab === 'items' ? 'text-[#52796F]' : 'text-[#8C8275] hover:text-[#2C2720]'
              }`}
            >
              <i data-lucide="package" className="w-5 h-5"></i>
              <span className="text-[10px] font-semibold">Mes Objets</span>
            </button>
            <button
              onClick={() => setCurrentTab('bookings')}
              className={`flex flex-col items-center gap-0.5 transition ${
                currentTab === 'bookings' ? 'text-[#52796F]' : 'text-[#8C8275] hover:text-[#2C2720]'
              }`}
            >
              <i data-lucide="calendar" className="w-5 h-5"></i>
              <span className="text-[10px] font-semibold">Réservations</span>
            </button>
            <button
              onClick={() => setCurrentTab('profile')}
              className={`flex flex-col items-center gap-0.5 transition ${
                currentTab === 'profile' ? 'text-[#52796F]' : 'text-[#8C8275] hover:text-[#2C2720]'
              }`}
            >
              <i data-lucide="user" className="w-5 h-5"></i>
              <span className="text-[10px] font-semibold">Compte</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
