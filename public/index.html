<!DOCTYPE html>

<body class="h-full w-full bg-[#E8E2D5] flex flex-col items-center justify-center font-sans antialiased selection:bg-[#E6EFE6] selection:text-[#354F48] p-0 sm:p-4">

      const [activeNotification, setActiveNotification] = useState(true);

      const users = {
        alban: {
          name: 'Alban D.',
          promo: '2A SN (Numérique)',
          school: 'Toulouse INP • ENSEEIHT',
          avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=120&q=80',
          activeItems: 2,
          wallet: 32.50
        },
        mathys: {
          name: 'Mathys D.',
          promo: '2A 3EA (Électronique/Énergie)',
          school: 'Toulouse INP • ENSEEIHT',
          avatar: 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?auto=format&fit=crop&w=120&q=80',
          activeItems: 3,
          wallet: 18.00
        }
      };

      const activeUserData = users[currentUser];

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [currentTab, deviceMode, currentUser, userRole, activeNotification]);

          return 'w-full h-full rounded-none shadow-none border-none';

        if (deviceMode === 'pixel') {
          return 'w-full h-full sm:h-[860px] sm:max-w-[412px] sm:rounded-[40px] sm:shadow-2xl sm:ring-8 sm:ring-black/15 border border-[#EAE2D5]';
        }
        // iPhone 15 Pro par défaut
        return 'w-full h-full sm:h-[844px] sm:max-w-[390px] sm:rounded-[48px] sm:shadow-2xl sm:ring-8 sm:ring-black/15 border border-[#EAE2D5]';
      };

      return (
        <div className="w-full h-full flex flex-col items-center justify-center">
          
          {/* BARRE D'OUTILS DIRECTIONNELLE (Visible sur PC / Mac pour Alban & Mathys) */}

              <span className="text-[#A89F91]">&bull;</span>

            {/* Sélecteur de profil actif */}

                    : 'text-[#6B6358] hover:text-[#2C2720]'

                          ? 'bg-[#D87D4A] text-white shadow-xs'

                  </div>
                </div>
              </div>

              {/* Ligne Inférieure : Widget Cagnotte & Garantie Cautions */}

                <div className="p-2.5 rounded-2xl bg-[#FAF8F5] border border-[#EAE2D5] flex items-center justify-between">

                    <span className="font-extrabold text-xs text-[#52796F] flex items-center gap-1">

                      <span className="text-[10px] text-[#8C8275]">(100%)</span>
                    </span>
                  </div>
                  <div className="w-7 h-7 rounded-xl bg-[#E6EFE6] text-[#354F48] flex items-center justify-center text-xs">
                    🛡️
                  </div>
                </div>
              </div>
            </header>

            {/* 3. CORPS TACTILE SCROLLABLE MULTI-ÉCRANS (Routage dynamique currentTab) */}

                    <div className="flex items-center justify-between">
                      <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-[#E6EFE6] text-[#354F48]">
                        <span className="w-1.5 h-1.5 rounded-full bg-[#52796F] animate-pulse"></span>

                      <span className="text-[10px] text-[#8C8275] font-semibold">Toute l'année</span>

                    {/* Sélecteur express de formule temporelle */}
                    <div className="grid grid-cols-3 gap-1.5 pt-1">
                      <div className="p-2 rounded-xl bg-white/90 border border-[#EAE2D5] text-center">
                        <span className="block text-[9px] text-[#8C8275] font-bold">24H SEMAINE</span>
                        <span className="text-xs font-extrabold text-[#2C2720]">Dès 5 €</span>
                      </div>
                      <div className="p-2 rounded-xl bg-[#52796F] text-white text-center shadow-xs">
                        <span className="block text-[9px] text-white/80 font-bold">WEEK-END</span>

                      <div className="p-2 rounded-xl bg-white/90 border border-[#EAE2D5] text-center">

                      <button className="px-3 py-1.5 rounded-full bg-white border border-[#EAE2D5] text-[#6B6358] text-xs font-semibold whitespace-nowrap hover:bg-[#FAF8F5]">
                        🍳 Convivialité
                      </button>
                    </div>
                  </div>

                  {/* Carte Objet Exemple 1 (Disponible 7j/7) */}

                    <div className="flex gap-3">

                      <div className="flex-1 min-w-0 flex flex-col justify-between">

                      <i data-lucide="calendar" className="w-3.5 h-3.5"></i>
                      <span>Choisir mes dates (Semaine ou WE)</span>

                  </div>

                  {/* Carte Objet Exemple 2 */}
                  <div className="p-3.5 rounded-3xl bg-white border border-[#EAE2D5] shadow-xs space-y-2.5">

                      <div className="w-14 h-14 rounded-2xl bg-[#FAF8F5] overflow-hidden flex-shrink-0">
                        <img
                          src={currentUser === 'alban' ? 'https://images.unsplash.com/photo-1545454675-3531b543be5d?auto=format&fit=crop&w=200&q=80' : 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=200&q=80'}
                          className="w-full h-full object-cover"
                        />
                      </div>
                      <div className="flex-1 min-w-0">
                        <h4 className="font-extrabold text-xs text-[#2C2720] truncate">
                          {currentUser === 'alban' ? 'JBL Partybox 310' : 'Appareil Raclette Tefal 8p'}
                        </h4>
                        <p className="text-[10px] text-[#6B6358]">
                          {currentUser === 'alban' ? '15€/jour &bull; 28€/we &bull; Caution 120€' : '6€/jour &bull; 12€/we &bull; Caution 40€'}
                        </p>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-2 pt-2 border-t border-[#F0EBE1]">
                      <button className="py-1.5 rounded-xl border border-[#EAE2D5] text-[#2C2720] text-xs font-semibold hover:bg-[#FAF8F5]">
                        Modifier tarifs
                      </button>
                      <button className="py-1.5 rounded-xl bg-[#FAF8F5] text-[#52796F] text-xs font-bold hover:bg-[#EAE2D5]">
                        Disponibilités 7j/7
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* VUE 3 : LOCATIONS (Réservations 7j/7, passations & historique) */}
              {currentTab === 'bookings' && (
                <div className="space-y-4 animate-fade-in">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-sm font-extrabold text-[#2C2720]">Mes Locations 7j/7</h3>
                      <p className="text-[10px] text-[#6B6358]">Semaine, week-end ou multi-jours</p>
                    </div>
                    <span className="px-2 py-0.5 rounded-full bg-[#E6EFE6] text-[#354F48] text-[9px] font-bold">
                      1 en cours
                    </span>
                  </div>

                  {/* Réservation active */}
                  <div className="p-4 rounded-3xl bg-white border border-[#EAE2D5] shadow-xs space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] font-extrabold text-[#52796F] uppercase tracking-wider flex items-center gap-1">
                        <i data-lucide="check-circle" className="w-3 h-3"></i>
                        Confirmée & Sécurisée
                      </span>
                      <span className="text-[10px] text-[#8C8275] font-semibold">Prêt en semaine</span>
                    </div>

                    <div className="bg-[#FAF8F5] p-3 rounded-2xl border border-[#EAE2D5] space-y-1.5">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-extrabold text-[#2C2720]">Perceuse sans fil Bosch 18V</span>
                        <span className="font-extrabold text-[#52796F]">6,00 €</span>
                      </div>
                      <div className="flex items-center gap-1.5 text-[10px] text-[#6B6358]">
                        <i data-lucide="clock" className="w-3 h-3 text-[#52796F]"></i>
                        <span>Mardi 14h00 &rarr; Mercredi 14h00 (24h)</span>
                      </div>
                      <div className="flex items-center gap-1.5 text-[10px] text-[#6B6358]">
                        <i data-lucide="map-pin" className="w-3 h-3 text-[#D87D4A]"></i>
                        <span>Retrait : Foyer des élèves N7</span>
                      </div>
                    </div>

                    <div className="flex items-center justify-between pt-1 text-xs">
                      <div className="flex items-center gap-1 text-[10px] text-[#354F48]">
                        <i data-lucide="shield-check" className="w-3.5 h-3.5 text-[#52796F]"></i>
                        <span>Caution 50 € <strong>non débitée</strong></span>
                      </div>
                      <button className="px-3 py-1 rounded-xl bg-[#52796F] text-white text-[10px] font-bold">
                        Code Retrait QR
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* VUE 4 : MON COMPTE & SÉCURITÉ CAMPUS */}
              {currentTab === 'profile' && (
                <div className="space-y-4 animate-fade-in">
                  <div className="p-4 rounded-3xl bg-white border border-[#EAE2D5] shadow-xs text-center space-y-2">
                    <img
                      src={activeUserData.avatar}
                      alt={activeUserData.name}
                      className="w-16 h-16 rounded-full mx-auto ring-4 ring-[#52796F]/20 object-cover shadow-sm"
                    />
                    <div>
                      <h3 className="text-sm font-extrabold text-[#2C2720] flex items-center justify-center gap-1">
                        <span>{activeUserData.name}</span>
                        <span className="text-[#52796F] text-xs">✓</span>
                      </h3>
                      <p className="text-xs text-[#6B6358]">{activeUserData.promo} &bull; {activeUserData.school}</p>
                      <p className="text-[10px] text-[#8C8275] font-mono mt-0.5">{currentUser}@enseeiht.fr</p>
                    </div>
                  </div>

                  <div className="p-3.5 rounded-3xl bg-[#FAF8F5] border border-[#EAE2D5] space-y-2">
                    <span className="text-[10px] font-bold text-[#8C8275] uppercase">Statut de Confiance Étudiant</span>
                    <div className="grid grid-cols-2 gap-2 text-center text-xs">
                      <div className="p-2.5 bg-white rounded-2xl border border-[#EAE2D5]">
                        <span className="block text-sm font-extrabold text-[#52796F]">100 %</span>
                        <span className="text-[9px] text-[#8C8275]">Matériel rendu intact</span>
                      </div>
                      <div className="p-2.5 bg-white rounded-2xl border border-[#EAE2D5]">
                        <span className="block text-sm font-extrabold text-[#2C2720]">0</span>
                        <span className="text-[9px] text-[#8C8275]">Litige signalé</span>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </main>

            {/* 4. BOTTOM NAVIGATION BAR TACTILE (Micro-tâche 1.1.3 active & validée) */}
            <nav className="border-t border-[#EAE2D5] bg-white/95 backdrop-blur-md px-2 py-1 flex items-center justify-around flex-shrink-0 z-20 shadow-sm">
              <button
                onClick={() => setCurrentTab('explore')}
                className={`flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 transition ${
                  currentTab === 'explore' ? 'text-[#52796F] font-bold' : 'text-[#8C8275] font-semibold hover:text-[#2C2720]'
                }`}
                title="Explorer le matériel 7j/7"
              >
                <i data-lucide="compass" className="w-5 h-5"></i>
                <span className="text-[10px]">Explorer</span>
              </button>
              <button
                onClick={() => setCurrentTab('items')}
                className={`flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 transition ${
                  currentTab === 'items' ? 'text-[#52796F] font-bold' : 'text-[#8C8275] font-semibold hover:text-[#2C2720]'
                }`}
                title="Gérer mes objets en prêt"
              >
                <i data-lucide="package" className="w-5 h-5"></i>
                <span className="text-[10px]">Mes Objets</span>
              </button>
              <button
                onClick={() => setCurrentTab('bookings')}
                className={`flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 transition ${
                  currentTab === 'bookings' ? 'text-[#52796F] font-bold' : 'text-[#8C8275] font-semibold hover:text-[#2C2720]'
                }`}
                title="Locations en semaine ou week-end"
              >
                <i data-lucide="calendar" className="w-5 h-5"></i>
                <span className="text-[10px]">Locations</span>
              </button>
              <button
                onClick={() => setCurrentTab('profile')}
                className={`flex-1 min-h-[48px] flex flex-col items-center justify-center gap-1 transition ${
                  currentTab === 'profile' ? 'text-[#52796F] font-bold' : 'text-[#8C8275] font-semibold hover:text-[#2C2720]'
                }`}
                title="Mon compte certifié N7"
              >
                <i data-lucide="user" className="w-5 h-5"></i>
                <span className="text-[10px]">Compte</span>
              </button>
            </nav>

          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
