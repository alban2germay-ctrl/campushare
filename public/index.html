<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CampuShare — Location Matériel 7j/7 • Toulouse INP - ENSEEIHT</title>

  <!-- PWA Meta Tags & Web App Manifest -->
  <meta name="theme-color" content="#FAF8F5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CampuShare">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            campus: {
              cream: '#FAF8F5',
              green: '#52796F',
              greenDark: '#354F48',
              orange: '#D87D4A',
              dark: '#2C2720',
              border: '#EAE2D5',
              card: '#FFFFFF'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- React & ReactDOM 18 (build de production, versions figées) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Lucide Icons (version figée) -->
  <script src="https://unpkg.com/lucide@1.55.0/dist/umd/lucide.min.js"></script>
  <!-- Babel n'est plus chargé ici : js/loader.js le télécharge seulement si un fichier a changé -->

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .mobile-scroll-container {
      scrollbar-width: thin;
      scrollbar-color: #EAE2D5 transparent;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="h-full w-full bg-[#E8E2D5] flex flex-col items-center justify-center font-sans antialiased selection:bg-[#E6EFE6] selection:text-[#354F48] p-0 sm:p-4">
  <div id="root" class="h-full w-full flex flex-col items-center justify-center"></div>

  <!-- MODULES DE L'APPLICATION CAMPUSHARE -->
  <!-- La liste des fichiers (données, composants, vues, app.js) est dans js/loader.js -->
  <script src="js/loader.js?v=20261012c"></script>

  <!-- 5. Service Worker (PWA installable & hors ligne) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('[CampuShare] Service worker non enregistré :', e));
      });
    }
  </script>
</body>
</html>
