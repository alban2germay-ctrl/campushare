                          <p className="text-[11px] text-[#8d96a0] mt-0.5">
                            {iss.id} ouvert par <strong className="text-[#58a6ff]">{iss.author}</strong>
                          </p>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

              </div>
            )}

          </main>

          {/* MODALE DE DÉTAIL DE LA PULL REQUEST */}
          {activePrModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4 animate-fade-in">
              <div className="w-full max-w-2xl bg-[#161b22] rounded-2xl p-6 space-y-4 shadow-2xl border border-[#30363d] max-h-[90vh] overflow-y-auto text-xs">
                
                <div className="flex items-start justify-between pb-3 border-b border-[#30363d]">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="px-2 py-0.5 rounded-full bg-[#8957e5]/20 text-[#a371f7] font-bold border border-[#8957e5]/30 flex items-center gap-1">
                        <i data-lucide="git-pull-request" className="w-3 h-3"></i>
                        <span>Merged</span>
                      </span>
                      <span className="font-mono text-[#8d96a0] font-bold">{activePrModal.number}</span>
                    </div>
                    <h3 className="font-extrabold text-base text-[#e6edf3] mt-1">
                      {activePrModal.title}
                    </h3>
                  </div>

                  <button
                    onClick={() => setActivePrModal(null)}
                    className="w-7 h-7 rounded-full bg-[#21262d] text-[#8d96a0] hover:text-[#e6edf3] flex items-center justify-center font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-3 rounded-xl bg-[#0d1117] border border-[#30363d] space-y-2">
                  <span className="text-[10px] font-bold uppercase text-[#8d96a0]">Description :</span>
                  <p className="text-[#e6edf3] leading-relaxed">
                    {activePrModal.desc}
                  </p>
                </div>

                {/* Reviewers */}
                <div className="p-3 rounded-xl bg-[#21262d] border border-[#30363d] space-y-1.5">
                  <span className="text-[10px] font-bold uppercase text-[#8d96a0]">Avis du Reviewer (@alban2germay-ctrl) :</span>
                  {activePrModal.reviews.map((r, i) => (
                    <div key={i} className="text-[#2ea043] font-semibold">
                      ✓ {r.user} : « {r.comment} »
                    </div>
                  ))}
                </div>

                {/* Fichiers modifiés */}
                <div className="space-y-1">
                  <span className="text-[10px] font-bold uppercase text-[#8d96a0]">Fichiers vérifiés :</span>
                  <div className="flex gap-2 flex-wrap">
                    {activePrModal.modifiedFiles.map((f, i) => (
                      <span key={i} className="font-mono text-[11px] text-[#58a6ff] bg-[#0d1117] px-2 py-0.5 rounded border border-[#30363d]">
                        {f}
                      </span>
                    ))}
                  </div>
                </div>

                <div className="pt-2">
                  <button
                    onClick={() => setActivePrModal(null)}
                    className="w-full py-2.5 rounded-xl bg-[#238636] hover:bg-[#2ea043] text-white font-bold transition text-xs"
                  >
                    Fermer la Pull Request
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="mt-auto border-t border-[#30363d] bg-[#161b22] py-4 px-4 text-center text-xs text-[#8d96a0]">
            <p>
              CampuShare &bull; Toulouse INP ENSEEIHT &bull; 
              Direction : Alban D. (2A SN) & Mathys D. (2A 3EA).
            </p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<GitHubRoadmapApp />);
  </script>
</body>
</html>
