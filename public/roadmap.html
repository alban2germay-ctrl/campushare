    // =========================================================================
    // COMPOSANT PRINCIPAL ROADMAP & PROOF PORTAL
    // =========================================================================
    function RoadmapPortal() {
      const [searchQuery, setSearchQuery] = useState('');
      const [filterStatus, setFilterStatus] = useState('all'); // 'all' | 'done' | 'todo' | 'backlog'
      const [filterOwner, setFilterOwner] = useState('all');   // 'all' | 'Alban' | 'Mathys' | 'IA'
      const [expandedSections, setExpandedSections] = useState({
        'phase-1': true,
        'phase-2': true,
        'phase-3': true,
        'phase-4': true,
        'phase-5': false
      });
      const [activeProofModal, setActiveProofModal] = useState(null);
      const [activeTab, setActiveTab] = useState('roadmap'); // 'roadmap' | 'deliberations' | 'metrics'
      const [copiedCommit, setCopiedCommit] = useState(null);

      // Calcul des statistiques globales
      const stats = useMemo(() => {
        let total = 0;
        let done = 0;
        let mathys = 0;
        ROADMAP_DATA.forEach(phase => {
          phase.epics.forEach(epic => {
            epic.tasks.forEach(task => {
              total++;
              if (task.status === 'done') done++;
              if (task.owner.toLowerCase().includes('mathys')) mathys++;
            });
          });
        });
        const pct = Math.round((done / total) * 100);
        return { total, done, mathys, pct };
      }, []);

      useEffect(() => {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      }, [expandedSections, filterStatus, filterOwner, searchQuery, activeTab, activeProofModal]);

      const toggleSection = (id) => {
        setExpandedSections(prev => ({
          ...prev,
          [id]: !prev[id]
        }));
      };

      const expandAll = () => {
        const next = {};
        ROADMAP_DATA.forEach(p => { next[p.id] = true; });
        setExpandedSections(next);
      };

      const collapseAll = () => {
        const next = {};
        ROADMAP_DATA.forEach(p => { next[p.id] = false; });
        setExpandedSections(next);
      };

      const handleCopy = (text) => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
        }
        setCopiedCommit(text);
        setTimeout(() => setCopiedCommit(null), 2000);
      };

      // Filtrage des données
      const filteredPhases = useMemo(() => {
        return ROADMAP_DATA.map(phase => {
          const filteredEpics = phase.epics.map(epic => {
            const filteredTasks = epic.tasks.filter(task => {
              // Filtre recherche
              const matchesSearch = searchQuery === '' || 
                task.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                task.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
                (task.proof && task.proof.desc && task.proof.desc.toLowerCase().includes(searchQuery.toLowerCase()));
              
              // Filtre statut
              const matchesStatus = filterStatus === 'all' ||
                (filterStatus === 'done' && task.status === 'done') ||
                (filterStatus === 'todo' && task.status === 'todo') ||
                (filterStatus === 'backlog' && task.status === 'backlog');

              // Filtre propriétaire
              const matchesOwner = filterOwner === 'all' ||
                (filterOwner === 'Alban' && task.owner.toLowerCase().includes('alban')) ||
                (filterOwner === 'Mathys' && task.owner.toLowerCase().includes('mathys')) ||
                (filterOwner === 'IA' && task.owner.toLowerCase().includes('agent'));

              return matchesSearch && matchesStatus && matchesOwner;
            });

            return {
              ...epic,
              tasks: filteredTasks
            };
          }).filter(epic => epic.tasks.length > 0);

          return {
            ...phase,
            epics: filteredEpics
          };
        }).filter(phase => phase.epics.length > 0);
      }, [searchQuery, filterStatus, filterOwner]);

                    onClick={() => setActiveProofModal(null)}
                    className="w-7 h-7 rounded-full bg-[#FAF8F5] text-[#8C8275] hover:text-[#2C2720] flex items-center justify-center text-xs font-bold border border-[#EAE2D5]"
                  >
                    ✕
                  </button>
                </div>

                {/* Données de preuve */}
                <div className="space-y-3 text-xs">
                  <div className="p-3.5 rounded-2xl bg-[#FAF8F5] border border-[#EAE2D5] space-y-2">
                    <span className="text-[10px] font-bold text-[#8C8275] uppercase block">
                      Description du livrable :
                    </span>
                    <p className="text-[#2C2720] leading-relaxed font-medium">
                      {activeProofModal.proof.desc}
                    </p>
                  </div>

                  {activeProofModal.proof.commit && (
                    <div className="p-3 rounded-2xl bg-white border border-[#EAE2D5] flex items-center justify-between">
                      <div>
                        <span className="text-[10px] font-bold text-[#8C8275] uppercase block">Hash Commit Git :</span>
                        <span className="font-mono font-extrabold text-[#2C2720] text-xs">
                          {activeProofModal.proof.commit}
                        </span>
                      </div>
                      <button
                        onClick={() => handleCopy(activeProofModal.proof.commit)}
                        className="px-3 py-1 rounded-xl bg-[#FAF8F5] text-[#52796F] font-bold text-xs hover:bg-[#E6EFE6] border border-[#EAE2D5]"
                      >
                        {copiedCommit === activeProofModal.proof.commit ? '✓ Copié !' : 'Copier'}
                      </button>
                    </div>
                  )}

                  <div className="p-3 rounded-2xl bg-white border border-[#EAE2D5] space-y-1">
                    <span className="text-[10px] font-bold text-[#8C8275] uppercase block">Fichiers vérifiés :</span>
                    <div className="flex gap-1.5 flex-wrap">
                      {activeProofModal.files.map((f, i) => (
                        <span key={i} className="font-mono text-[11px] bg-[#FAF8F5] px-2 py-0.5 rounded-md border border-[#EAE2D5] text-[#52796F] font-semibold">
                          {f}
                        </span>
                      ))}
                    </div>
                  </div>

                  {activeProofModal.proof.codeDiff && (
                    <div className="p-3 rounded-2xl bg-[#E6EFE6] text-[#354F48] font-semibold flex items-center justify-between">
                      <span>Diff de simplification :</span>
                      <span className="font-extrabold">{activeProofModal.proof.codeDiff}</span>
                    </div>
                  )}
                </div>

                {/* Fermer */}
                <div className="pt-2">
                  <button
                    onClick={() => setActiveProofModal(null)}
                    className="w-full py-2.5 rounded-xl bg-[#52796F] text-white text-xs font-bold hover:bg-[#43665D] transition"
                  >
                    Fermer la preuve
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="mt-auto border-t border-[#EAE2D5] bg-white py-4 px-4 text-center text-xs text-[#8C8275]">
            <p>
              CampuShare &bull; Plateforme étudiante de prêt 7j/7 &bull; Toulouse INP ENSEEIHT &bull; 
              Conseil de Direction : Alban (2A SN) & Mathys (2A 3EA).
            </p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<RoadmapPortal />);
  </script>
</body>
</html>
